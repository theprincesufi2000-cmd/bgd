name: Build Highway MSI Tool

on:
  push:
    branches:
      - automation/highway-msi-tool-20261005
    paths:
      - tools/highway-msitool/**
      - .github/workflows/build-highway-msitool.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build standalone MSI packager
        working-directory: tools/highway-msitool
        run: |
          rm -f go.mod go.sum
          go mod init highway-msibuilder
          go get go.digitalxero.dev/go-msi@latest
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o msibuilder .

      - uses: actions/upload-artifact@v4
        with:
          name: highway-msibuilder-linux-amd64
          path: tools/highway-msitool/msibuilder
          if-no-files-found: error
          retention-days: 1
