name: Build Baghdadi from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Baghdadi*.zip'
      - '.github/workflows/build-baghdadi-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extract and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Extract project ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
              -iname 'Baghdadi*.zip' -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo 'لم يتم العثور على ملف Baghdadi*.zip في المستودع.' >&2
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo 'يوجد أكثر من ملف Baghdadi ZIP. اترك نسخة واحدة فقط:' >&2
            printf ' - %s\n' "${ZIP_FILES[@]}" >&2
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/baghdadi-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "${ZIP_FILES[0]}" -d "$EXTRACT_DIR"

          GRADLEW_FILE="$(find "$EXTRACT_DIR" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW_FILE" ]; then
            echo 'تم فك الضغط، لكن لم يتم العثور على ملف gradlew.' >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "تم العثور على مشروع Android في: $PROJECT_DIR"

      - name: Validate project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew

          if [ -f tools/clean-android-resources.sh ]; then
            chmod +x tools/clean-android-resources.sh
            ./tools/clean-android-resources.sh
          fi

          if [ -f tools/validate-v2.3.0.sh ]; then
            chmod +x tools/validate-v2.3.0.sh
            ./tools/validate-v2.3.0.sh
          fi

          if [ -f push-relay/src/index.js ]; then
            node --check push-relay/src/index.js
          fi

          if [ -f functions/index.js ]; then
            node --check functions/index.js
          fi

      - name: Build APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          KEYSTORE_BASE64: ${{ secrets.BAGHDADI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BAGHDADI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAGHDADI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAGHDADI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$OUTPUT_DIR"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            KEYSTORE_FILE="$RUNNER_TEMP/baghdadi-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

            ./gradlew --no-daemon --stacktrace clean assembleRelease \
              -PBAGHDADI_STORE_FILE="$KEYSTORE_FILE" \
              -PBAGHDADI_STORE_PASSWORD="$STORE_PASSWORD" \
              -PBAGHDADI_KEY_ALIAS="$KEY_ALIAS" \
              -PBAGHDADI_KEY_PASSWORD="$KEY_PASSWORD"

            SOURCE_APK='app/build/outputs/apk/release/app-release.apk'
            OUTPUT_NAME='Baghdadi-v2.4.0-release.apk'
            ARTIFACT_NAME='Baghdadi-v2.4.0-release'
          else
            echo 'مفاتيح توقيع Release غير مكتملة؛ سيتم بناء نسخة Debug قابلة للتثبيت.'
            ./gradlew --no-daemon --stacktrace clean assembleDebug

            SOURCE_APK='app/build/outputs/apk/debug/app-debug.apk'
            OUTPUT_NAME='Baghdadi-v2.4.0-debug.apk'
            ARTIFACT_NAME='Baghdadi-v2.4.0-debug'
          fi

          if [ ! -s "$SOURCE_APK" ]; then
            echo "لم يتم إنشاء APK في المسار المتوقع: $SOURCE_APK" >&2
            exit 1
          fi

          cp "$SOURCE_APK" "$OUTPUT_DIR/$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_DIR/$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
