name: Export Baghdadi Offline Android Build Kit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baghdadi-offline-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Build and export Linux x64 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore and verify Baghdadi source
        id: source
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          sha256sum -c <<'SUMS'
          aea711716736175de0716d687300b9ddd552b9245a6d8bc671e43dd33aaee5fa  Baghdadi-source-part-001.zip
          bdd3e8e144270cce7f7bfa0187a2f242652b9799553417581f2220050d94a4f4  Baghdadi-source-part-002.zip
          SUMS

          work="$(mktemp -d "$RUNNER_TEMP/baghdadi-source.XXXXXX")"
          inner='Baghdadi-v2.9.0-Social-Complete-Source.zip'
          unzip -p Baghdadi-source-part-001.zip "$inner.part-001" > "$work/source.part-001"
          unzip -p Baghdadi-source-part-002.zip "$inner.part-002" > "$work/source.part-002"
          cat "$work/source.part-001" "$work/source.part-002" > "$work/$inner"
          echo '55d646fd3ac8eb56d3cb1c633d364ad1ca83ba663ae094016835c9209bcc17ec  '"$work/$inner" | sha256sum -c -
          unzip -q "$work/$inner" -d "$work/project"

          for required in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml; do
            test -s "$work/project/$required"
          done
          grep -Fq "versionName '2.9.0'" "$work/project/app/build.gradle"
          grep -Fq 'compileSdk 36' "$work/project/app/build.gradle"

          printf 'project=%s\n' "$work/project" >> "$GITHUB_OUTPUT"
          printf 'source_archive=%s\n' "$work/$inner" >> "$GITHUB_OUTPUT"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Download and verify Gradle 8.11.1
        id: gradle
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$destination"
          cd "$destination"
          curl --fail --location --retry 5 --retry-all-errors \
            'https://services.gradle.org/distributions/gradle-8.11.1-bin.zip' \
            --output gradle-8.11.1-bin.zip
          curl --fail --location --retry 5 --retry-all-errors \
            'https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256' \
            --output gradle-8.11.1-bin.zip.sha256
          checksum="$(tr -d '[:space:]' < gradle-8.11.1-bin.zip.sha256)"
          test "${#checksum}" -eq 64
          printf '%s  %s\n' "$checksum" gradle-8.11.1-bin.zip | sha256sum -c -
          unzip -q gradle-8.11.1-bin.zip
          test -x "$destination/gradle-8.11.1/bin/gradle"
          printf 'home=%s\n' "$destination/gradle-8.11.1" >> "$GITHUB_OUTPUT"

      - name: Populate every project dependency
        env:
          PROJECT: ${{ steps.source.outputs.project }}
          GRADLE_HOME: ${{ steps.gradle.outputs.home }}
          GRADLE_USER_HOME: ${{ runner.temp }}/baghdadi-gradle-home
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT/local.properties"
          cd "$PROJECT"
          "$GRADLE_HOME/bin/gradle" \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --refresh-dependencies \
            --max-workers=2 \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease

      - name: Assemble portable offline kit
        id: kit
        env:
          PROJECT: ${{ steps.source.outputs.project }}
          GRADLE_HOME: ${{ steps.gradle.outputs.home }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
          CACHE_HOME: ${{ runner.temp }}/baghdadi-gradle-home
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/baghdadi-offline-kit-linux-x64"
          output="$RUNNER_TEMP/baghdadi-offline-output"
          mkdir -p \
            "$kit/jdk" \
            "$kit/android-sdk/build-tools" \
            "$kit/android-sdk/platforms" \
            "$kit/gradle-user-home" \
            "$output"

          cp -a "$JAVA_HOME/." "$kit/jdk/"
          cp -a "$GRADLE_HOME" "$kit/gradle-8.11.1"
          cp -a "$CACHE_HOME/." "$kit/gradle-user-home/"
          cp -a "$ANDROID_HOME/build-tools/36.0.0" "$kit/android-sdk/build-tools/36.0.0"
          cp -a "$ANDROID_HOME/platforms/android-36" "$kit/android-sdk/platforms/android-36"
          cp -a "$ANDROID_HOME/platform-tools" "$kit/android-sdk/platform-tools"
          if [[ -d "$ANDROID_HOME/licenses" ]]; then
            cp -a "$ANDROID_HOME/licenses" "$kit/android-sdk/licenses"
          fi

          find "$kit/gradle-user-home" -type f -name '*.lock' -delete

          cat > "$kit/build-offline.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          kit_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          project="${1:-$PWD}"
          project="$(cd "$project" && pwd)"
          export JAVA_HOME="$kit_root/jdk"
          export ANDROID_HOME="$kit_root/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export GRADLE_USER_HOME="$kit_root/gradle-user-home"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$kit_root/gradle-8.11.1/bin:$PATH"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$project/local.properties"
          cd "$project"
          exec "$kit_root/gradle-8.11.1/bin/gradle" \
            --offline \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --max-workers=2 \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          SCRIPT
          chmod 0755 "$kit/build-offline.sh"

          cat > "$kit/README_AR.txt" <<'README'
          بيئة بناء بغدادي 2.9.0 دون إنترنت — Linux x86_64

          المحتويات: Temurin JDK 17، Android SDK 36، Build Tools 36.0.0،
          Gradle 8.11.1 وجميع اعتمادات Gradle التي استخدمها البناء الفعلي.

          الاستخدام بعد استخراج الحزمة:
            ./baghdadi-offline-kit-linux-x64/build-offline.sh /path/to/project

          البناء يستخدم --offline ولا يحتوي على JKS أو كلمات مرور.
          لإنتاج Release موقع، مرر خصائص BAGHDADI_STORE_FILE وبيانات التوقيع
          كمتغيرات ORG_GRADLE_PROJECT_ خارج هذه الحزمة.
          README

          {
            echo 'Baghdadi offline Android build kit'
            echo 'OS: Linux x86_64'
            echo 'Java: Temurin JDK 17'
            echo 'Gradle: 8.11.1'
            echo 'Android platform: 36'
            echo 'Android build-tools: 36.0.0'
            echo 'Source SHA-256: 55d646fd3ac8eb56d3cb1c633d364ad1ca83ba663ae094016835c9209bcc17ec'
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$kit/MANIFEST.txt"

          printf 'kit=%s\n' "$kit" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Prove the copied kit works completely offline
        env:
          KIT: ${{ steps.kit.outputs.kit }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
        run: |
          set -euo pipefail
          check="$(mktemp -d "$RUNNER_TEMP/baghdadi-offline-check.XXXXXX")"
          unzip -q "$SOURCE_ARCHIVE" -d "$check/project"

          export JAVA_HOME="$KIT/jdk"
          export ANDROID_HOME="$KIT/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export GRADLE_USER_HOME="$KIT/gradle-user-home"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$KIT/gradle-8.11.1/bin:$PATH"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$check/project/local.properties"
          cd "$check/project"
          "$KIT/gradle-8.11.1/bin/gradle" \
            --offline \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --max-workers=2 \
            :app:clean \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          find "$KIT/gradle-user-home" -type f -name '*.lock' -delete

      - name: Compress and split the verified kit
        env:
          KIT: ${{ steps.kit.outputs.kit }}
          OUTPUT: ${{ steps.kit.outputs.output }}
        run: |
          set -euo pipefail
          parent="$(dirname "$KIT")"
          name="$(basename "$KIT")"
          archive="$OUTPUT/$name.tar.zst"
          tar -C "$parent" -I 'zstd -T0 -10' -cf "$archive" "$name"
          sha256sum "$archive" > "$OUTPUT/$name.tar.zst.sha256"
          split \
            --bytes=90M \
            --numeric-suffixes=1 \
            --suffix-length=3 \
            "$archive" \
            "$OUTPUT/$name.tar.zst.part-"
          sha256sum "$OUTPUT"/*.part-* > "$OUTPUT/PARTS_SHA256SUMS.txt"
          rm -f "$archive"

          cat > "$OUTPUT/UPLOAD_THESE_FILES_AR.txt" <<'INSTRUCTIONS'
          استخرج Artifact الذي نزّلته من GitHub، ثم ارفع إلى المحادثة:
          1. جميع الملفات التي ينتهي اسمها بـ tar.zst.part-XXX
          2. ملف PARTS_SHA256SUMS.txt
          3. ملف baghdadi-offline-kit-linux-x64.tar.zst.sha256

          لا تفك ضغط أجزاء tar.zst ولا تغيّر أسماءها.
          لا ترفع JKS أو كلمات المرور ضمن حزمة البيئة.
          INSTRUCTIONS

          echo 'Created files:'
          find "$OUTPUT" -maxdepth 1 -type f -printf '%f  %s bytes\n' | sort

      - name: Upload offline environment parts
        uses: actions/upload-artifact@v4
        with:
          name: Baghdadi-offline-build-kit-linux-x64
          path: ${{ steps.kit.outputs.output }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
