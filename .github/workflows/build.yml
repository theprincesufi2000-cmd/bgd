name: Build Baghdadi v2.9.0 Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - Baghdadi-source-part-001.zip
      - Baghdadi-source-part-002.zip
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: baghdadi-v290-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify parts and restore source
        id: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          wrappers = [
              ('001', 19254656, '480693949a9d4491c19d8d899c9712816534ef800e9518e3a47d3bdd5bb00e95',
               19254456, 'c61165899759c6209a6dd6c9bc6c297874e375c670e8517814204e7b28648279'),
              ('002', 19254655, 'ccd906b52ebb1684cd526cfce42e45c4e5448a0aea288634acd70077a385bcd6',
               19254455, '1f29c3375a5c91401c0c75895988c2abb1dfe30be44f3123e43dae5f6e2e1394'),
          ]
          source_size = 38508911
          source_sha = 'b2325155b45fc3bde53c07cf9c471c91721fcc513e25d73556c20c3c35c5bf55'
          repo = Path(os.environ['GITHUB_WORKSPACE'])
          temp = Path(tempfile.mkdtemp(prefix='baghdadi-v290-', dir=os.environ['RUNNER_TEMP']))
          archive = temp / 'Baghdadi-v2.9.0-Social-Complete-Source.zip'
          joined = hashlib.sha256()

          with archive.open('wb') as output:
              for number, wrapper_size, wrapper_sha, part_size, part_sha in wrappers:
                  wrapper = repo / f'Baghdadi-source-part-{number}.zip'
                  if not wrapper.is_file():
                      raise SystemExit(f'Missing {wrapper.name}; upload both ZIP files without renaming them.')
                  if wrapper.stat().st_size != wrapper_size:
                      raise SystemExit(f'Incorrect size: {wrapper.name}')
                  if hashlib.sha256(wrapper.read_bytes()).hexdigest() != wrapper_sha:
                      raise SystemExit(f'SHA-256 mismatch: {wrapper.name}')
                  expected_name = f'Baghdadi-v2.9.0-Social-Complete-Source.zip.part-{number}'
                  with zipfile.ZipFile(wrapper) as outer:
                      entries = [entry for entry in outer.infolist() if not entry.is_dir()]
                      if len(entries) != 1 or entries[0].filename != expected_name:
                          raise SystemExit(f'Unexpected contents: {wrapper.name}')
                      digest = hashlib.sha256()
                      total = 0
                      with outer.open(entries[0]) as part:
                          while True:
                              chunk = part.read(1024 * 1024)
                              if not chunk:
                                  break
                              total += len(chunk)
                              digest.update(chunk)
                              joined.update(chunk)
                              output.write(chunk)
                      if total != part_size or digest.hexdigest() != part_sha:
                          raise SystemExit(f'Damaged inner part: {wrapper.name}')

          if archive.stat().st_size != source_size or joined.hexdigest() != source_sha:
              raise SystemExit('The reconstructed source does not match the verified v2.9.0 archive.')

          destination = temp / 'project'
          destination.mkdir()
          seen = set()
          total_uncompressed = 0
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in entry.filename:
                      raise SystemExit('Unsafe path in source archive.')
                  if path in seen or stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit('Duplicate path or symlink in source archive.')
                  seen.add(path)
                  total_uncompressed += entry.file_size
                  if total_uncompressed > 1024 * 1024 * 1024:
                      raise SystemExit('Unexpected expanded source size.')
              damaged = source.testzip()
              if damaged:
                  raise SystemExit('Damaged source entry: ' + damaged)
              source.extractall(destination)

          required = [
              'settings.gradle', 'build.gradle', 'app/build.gradle', 'app/src/main/AndroidManifest.xml',
              'gradle/wrapper/gradle-wrapper.jar', 'firestore.rules', 'push-relay/src/index.js'
          ]
          for item in required:
              if not (destination / item).is_file():
                  raise SystemExit('Missing project file: ' + item)
          gradle_text = (destination / 'app/build.gradle').read_text(encoding='utf-8')
          if "versionCode 26" not in gradle_text or "versionName '2.9.0'" not in gradle_text:
              raise SystemExit('Unexpected application version.')
          output_dir = temp / 'output'
          output_dir.mkdir()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              print('project=' + str(destination), file=handle)
              print('output=' + str(output_dir), file=handle)
          print('Verified source SHA-256:', source_sha)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 tools
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Static and relay tests
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          bash tools/clean-android-resources.sh
          node --check push-relay/src/index.js
          node --check functions/index.js
          node --test tools/tests/worker.test.mjs

      - name: Build signed Release APK
        env:
          PROJECT: ${{ steps.source.outputs.project }}
          OUTPUT: ${{ steps.source.outputs.output }}
          KEYSTORE_BASE64: ${{ secrets.BAGHDADI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BAGHDADI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAGHDADI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAGHDADI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
          signing_dir="$(mktemp -d "$RUNNER_TEMP/baghdadi-signing.XXXXXX")"
          keystore="$signing_dir/release.jks"
          trap 'rm -f -- "$keystore"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ORG_GRADLE_PROJECT_BAGHDADI_STORE_FILE="$keystore"
          export ORG_GRADLE_PROJECT_BAGHDADI_STORE_PASSWORD="$STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_BAGHDADI_KEY_ALIAS="$KEY_ALIAS"
          export ORG_GRADLE_PROJECT_BAGHDADI_KEY_PASSWORD="$KEY_PASSWORD"
          unset KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          cd "$PROJECT"
          gradle --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            | tee "$OUTPUT/signature-info.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$OUTPUT/apk-info.txt"
          cp "$apk" "$OUTPUT/Baghdadi-v2.9.0-release.apk"
          (cd "$OUTPUT" && sha256sum Baghdadi-v2.9.0-release.apk > SHA256SUMS.txt)

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Baghdadi-v2.9.0-release-apk
          path: ${{ steps.source.outputs.output }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure() && steps.source.outputs.project != ''
        uses: actions/upload-artifact@v4
        with:
          name: Baghdadi-v2.9.0-build-diagnostics
          path: |
            ${{ steps.source.outputs.project }}/app/build/reports/
            ${{ steps.source.outputs.project }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
